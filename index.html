<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>Przepisy</title>
<style>
:root{--bg:#f6efe7;--card:#fffdf9;--ink:#24201c;--muted:#746b62;--line:#eadccf;--accent:#d65f39;--soft:#fff0e6;--shadow:0 14px 40px #4d382518}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#ffe8cd 0,transparent 28rem),var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:#f6efe7e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px}
.top{max-width:1500px;margin:auto;display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:12px;align-items:center}
.brand{display:flex;gap:9px;align-items:center;font-weight:900}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#d65f39,#f3a14b);font-size:23px}
#q{width:100%;height:46px;border:1px solid var(--line);border-radius:15px;background:var(--card);padding:0 15px;outline:0}
.units{display:flex;background:#eadfd4;padding:3px;border-radius:12px}.units button{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-weight:850;cursor:pointer}.units .on{background:#fff;color:var(--accent);box-shadow:0 3px 10px #4d38251c}
.filterbar{max-width:1500px;margin:10px auto 0;display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,1fr) auto;gap:9px}
.filterbar select,.clear{height:42px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:0 12px;color:var(--ink);outline:0}
.clear{padding:0 15px;background:#fff4e9;font-weight:800;cursor:pointer}.clear:disabled{opacity:.45;cursor:default}
.wrap{max-width:1500px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(290px,390px) minmax(0,1fr);gap:18px;align-items:start}
aside,article{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
aside{position:sticky;top:139px;max-height:calc(100vh - 157px);overflow:auto}.count{position:sticky;top:0;background:#fffdf9ef;backdrop-filter:blur(8px);padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:750}
.item{display:grid;grid-template-columns:78px 1fr;gap:11px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:var(--soft)}.item img{width:78px;height:78px;object-fit:cover;border-radius:13px;background:#eee}.item b{line-height:1.25;display:block;margin:4px 0}.meta{font-size:12px;color:var(--muted)}
.more{margin:12px;width:calc(100% - 24px);border:1px solid var(--line);background:#fff7ef;padding:10px;border-radius:12px;font-weight:800;cursor:pointer}
.hero{position:relative;background:#ddd}.hero img{width:100%;max-height:600px;aspect-ratio:16/9;object-fit:cover;display:block}.hero:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#1b120db8)}.title{position:absolute;left:clamp(18px,4vw,38px);right:30px;bottom:28px;z-index:2;color:#fff}.title h1{margin:5px 0;font-size:clamp(30px,5vw,54px);line-height:1.02}
.body{padding:clamp(18px,4vw,38px)}h2{margin:30px 0 12px}.note{padding:12px 14px;background:var(--soft);border:1px solid #f0d2c1;border-radius:14px;color:#6d4938;font-size:13px}
.ingredients{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ing{padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff}.steps{display:grid;gap:13px}.step{display:grid;grid-template-columns:42px 1fr;gap:13px;padding:14px;border:1px solid var(--line);border-radius:15px}.n{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#d65f39,#f3a14b);color:#fff;font-weight:900}.step img{width:100%;max-width:650px;margin-top:12px;border-radius:13px}.source{margin-top:28px;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#efe4da;color:#685e56}
@media(max-width:800px){header{position:relative}.top{grid-template-columns:1fr auto}.top #q{grid-column:1/-1}.filterbar{grid-template-columns:1fr 1fr}.clear{grid-column:1/-1}.wrap{grid-template-columns:1fr;padding:10px}aside{position:relative;top:auto;max-height:390px}.ingredients{grid-template-columns:1fr}.hero img{aspect-ratio:4/3}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo">🍳</div><span>Moje przepisy</span></div>
    <input id="q" type="search" placeholder="Szukaj przepisu lub składnika…">
    <div class="units"><button data-u="US">USA</button><button data-u="EU">EU</button></div>
  </div>
  <div class="filterbar">
    <select id="categoryFilter" aria-label="Kategoria">
      <option value="">Wszystkie kategorie</option>
    </select>
    <select id="regionFilter" aria-label="Region">
      <option value="">Wszystkie regiony</option>
    </select>
    <button id="clearFilters" class="clear" type="button">Wyczyść filtry</button>
  </div>
</header>

<main class="wrap">
  <aside>
    <div class="count" id="count">Ładowanie…</div>
    <div id="list"></div>
    <button id="more" class="more" hidden>Pokaż więcej</button>
  </aside>
  <article id="recipe">
    <div class="empty">
      <h2>Wybierz przepis</h2>
      <p>Możesz jednocześnie filtrować po kategorii, regionie i wyszukiwanej frazie.</p>
    </div>
  </article>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=[], shown=120, current=null, manifest=null, unit=localStorage.getItem('unit')||'US';

const frac={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};

function asArray(value){
  if(value==null) return [];
  if(Array.isArray(value)) return value.flatMap(asArray).filter(Boolean);
  if(typeof value==='string'){
    const s=value.trim();
    if(!s) return [];
    return s.includes(',') ? s.split(',').map(x=>x.trim()).filter(Boolean) : [s];
  }
  return [String(value)];
}

function unique(values){
  const out=[],seen=new Set();
  for(const value of values){
    const s=String(value||'').trim();
    if(!s) continue;
    const key=s.toLocaleLowerCase('en-US');
    if(seen.has(key)) continue;
    seen.add(key); out.push(s);
  }
  return out;
}

function getCategories(r){
  return unique([
    ...asArray(r.categories),
    ...asArray(r.category)
  ]);
}

function getRegions(r){
  return unique([
    ...asArray(r.regions),
    ...asArray(r.cuisines),
    ...asArray(r.cuisine),
    ...asArray(r.area)
  ]);
}

function eqCI(a,b){
  return String(a||'').trim().toLocaleLowerCase('en-US')===
         String(b||'').trim().toLocaleLowerCase('en-US');
}

function num(s){
  s=String(s).trim();
  if(frac[s]!=null)return frac[s];
  let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(m)return +m[1]+m[2]/m[3];
  m=s.match(/^(\d+)\/(\d+)$/);
  if(m)return m[1]/m[2];
  let n=+s.replace(',','.');
  return Number.isFinite(n)?n:null
}

function fmt(n,d=1){
  return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:d}).format(n)
}

function euMeasure(s){
  if(!s)return s;
  const q='(\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])';
  const rules=[
    [new RegExp('^'+q+'\\s*(cups?)\\b','i'),236.588,'ml'],
    [new RegExp('^'+q+'\\s*(tbsp|tablespoons?)\\b','i'),14.7868,'ml'],
    [new RegExp('^'+q+'\\s*(tsp|teaspoons?)\\b','i'),4.92892,'ml'],
    [new RegExp('^'+q+'\\s*(fl\\.?\\s*oz\\.?|fluid ounces?)\\b','i'),29.5735,'ml'],
    [new RegExp('^'+q+'\\s*(quarts?|qt)\\b','i'),946.353,'ml'],
    [new RegExp('^'+q+'\\s*(pints?|pt)\\b','i'),473.176,'ml'],
    [new RegExp('^'+q+'\\s*(lbs?|pounds?)\\b','i'),453.592,'g'],
    [new RegExp('^'+q+'\\s*(oz|ounces?)\\b','i'),28.3495,'g']
  ];
  for(const [re,f,u] of rules){
    let m=s.match(re); if(!m)continue;
    let n=num(m[1]); if(n==null)continue;
    let v=n*f, outUnit=u;
    if(u==='ml'&&v>=1000){v/=1000;outUnit='l'}
    if(u==='g'&&v>=1000){v/=1000;outUnit='kg'}
    return `${fmt(v,v<10?2:v<100?1:0)} ${outUnit}${s.slice(m[0].length)}`
  }
  return s;
}

function euText(s){
  return String(s||'')
    .replace(/(\d{2,3})\s*(?:°\s*)?(?:degrees?\s*)?(?:F|Fahrenheit)\b/gi,
      (_,v)=>`${Math.round((((+v)-32)*5/9)/5)*5}°C`)
    .replace(/\b(\d+(?:[.,]\d+)?)\s*(?:inch|inches|in\.)\b/gi,
      (_,v)=>`${fmt(+v.replace(',','.')*2.54,1)} cm`)
}

function updateBtns(){
  document.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('on',b.dataset.u===unit))
}

function buildFilterOptions(){
  const categoryCounts=new Map();
  const regionCounts=new Map();

  for(const r of all){
    for(const c of getCategories(r)) categoryCounts.set(c,(categoryCounts.get(c)||0)+1);
    for(const g of getRegions(r)) regionCounts.set(g,(regionCounts.get(g)||0)+1);
  }

  const sortEntries=map=>[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'pl',{sensitivity:'base'}));

  $('#categoryFilter').innerHTML=
    '<option value="">Wszystkie kategorie</option>'+
    sortEntries(categoryCounts).map(([name,n])=>
      `<option value="${esc(name)}">${esc(name)} (${n})</option>`
    ).join('');

  $('#regionFilter').innerHTML=
    '<option value="">Wszystkie regiony</option>'+
    sortEntries(regionCounts).map(([name,n])=>
      `<option value="${esc(name)}">${esc(name)} (${n})</option>`
    ).join('');
}

function filteredRecipes(){
  const q=$('#q').value.trim().toLocaleLowerCase('pl');
  const selectedCategory=$('#categoryFilter').value;
  const selectedRegion=$('#regionFilter').value;

  return all.filter(r=>{
    const categories=getCategories(r);
    const regions=getRegions(r);

    if(selectedCategory && !categories.some(x=>eqCI(x,selectedCategory))) return false;
    if(selectedRegion && !regions.some(x=>eqCI(x,selectedRegion))) return false;

    if(q){
      const haystack=[
        r.title,
        ...categories,
        ...regions,
        ...asArray(r.ingredients_search)
      ].filter(Boolean).join(' ').toLocaleLowerCase('pl');

      if(!haystack.includes(q)) return false;
    }

    return true;
  });
}

function renderList(){
  const filtered=filteredRecipes();
  const selectedCategory=$('#categoryFilter').value;
  const selectedRegion=$('#regionFilter').value;
  const q=$('#q').value.trim();

  const activeParts=[];
  if(selectedCategory) activeParts.push(`kategoria: ${selectedCategory}`);
  if(selectedRegion) activeParts.push(`region: ${selectedRegion}`);
  if(q) activeParts.push(`szukaj: „${q}”`);

  $('#count').textContent=
    `${filtered.length.toLocaleString('pl-PL')} z ${all.length.toLocaleString('pl-PL')} przepisów`+
    (activeParts.length?` • ${activeParts.join(' • ')}`:'');

  const part=filtered.slice(0,shown);

  $('#list').innerHTML=part.length ? part.map(r=>{
    const cats=getCategories(r);
    const regs=getRegions(r);
    const meta=[...cats.slice(0,1),...regs.slice(0,1)];
    return `<div class="item ${current&&current.id===r.id?'active':''}" data-id="${esc(r.id)}">
      ${r.image?`<img loading="lazy" src="${esc(r.image)}" alt="">`:''}
      <div>
        <b>${esc(r.title)}</b>
        <div class="meta">${esc(meta.join(' • '))}</div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">Brak przepisów dla wybranych filtrów.</div>';

  $('#more').hidden=part.length>=filtered.length;

  document.querySelectorAll('.item').forEach(x=>{
    x.onclick=()=>{
      const row=all.find(r=>String(r.id)===String(x.dataset.id));
      if(row) openRecipe(row);
    };
  });

  $('#clearFilters').disabled=!selectedCategory&&!selectedRegion&&!q;
}

async function openRecipe(row){
  const response=await fetch(row.file,{cache:'no-store'});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  current=await response.json();
  history.replaceState(null,'',`?id=${encodeURIComponent(current.id)}`);
  renderRecipe();
  renderList();
}

function renderRecipe(){
  if(!current)return;
  const r=current;
  const cats=getCategories(r);
  const regs=getRegions(r);
  const labels=[...cats,...regs];

  $('#recipe').innerHTML=`
    <div class="hero">
      ${r.images?.hero?`<img src="${esc(r.images.hero)}" alt="${esc(r.title)}">`:''}
      <div class="title">
        <div>${esc(labels.join(' • '))}</div>
        <h1>${esc(r.title)}</h1>
      </div>
    </div>
    <div class="body">
      <div class="note">${unit==='US'
        ?'🇺🇸 Oryginalne miary USA.'
        :'🇪🇺 Automatyczne przeliczenie na miary europejskie. Oryginalne dane pozostają zapisane w JSON.'}</div>

      <h2>🧺 Składniki</h2>
      <div class="ingredients">
        ${(r.ingredients||[]).map(x=>`<div class="ing">${esc(unit==='EU'?euMeasure(x):x)}</div>`).join('')}
      </div>

      <h2>👩‍🍳 Przygotowanie</h2>
      <div class="steps">
        ${(r.steps||[]).map((x,i)=>`
          <div class="step">
            <div class="n">${i+1}</div>
            <div>
              ${esc(unit==='EU'?euText(x.text):x.text)}
              ${x.image?`<img loading="lazy" src="${esc(x.image)}" alt="">`:''}
            </div>
          </div>
        `).join('')}
      </div>

      ${r.yield?.length?`<div class="source">Porcje: ${esc(r.yield.join(', '))}</div>`:''}
    </div>`;
}

function refreshFilters(){
  shown=120;
  renderList();
}

document.querySelectorAll('[data-u]').forEach(b=>{
  b.onclick=()=>{
    unit=b.dataset.u;
    localStorage.setItem('unit',unit);
    updateBtns();
    renderRecipe();
  }
});

$('#q').oninput=refreshFilters;
$('#categoryFilter').onchange=refreshFilters;
$('#regionFilter').onchange=refreshFilters;
$('#more').onclick=()=>{shown+=120;renderList()};
$('#clearFilters').onclick=()=>{
  $('#q').value='';
  $('#categoryFilter').value='';
  $('#regionFilter').value='';
  shown=120;
  renderList();
};

(async()=>{
  updateBtns();
  const response=await fetch('data/recipes_manifest.json',{cache:'no-store'});
  if(!response.ok) throw new Error(`Nie udało się pobrać manifestu: HTTP ${response.status}`);

  manifest=await response.json();
  all=(manifest.recipes||[]).map(r=>({
    ...r,
    categories:getCategories(r),
    regions:getRegions(r)
  }));

  buildFilterOptions();
  renderList();

  const id=new URLSearchParams(location.search).get('id');
  if(id){
    const hit=all.find(x=>String(x.id)===String(id));
    if(hit) await openRecipe(hit);
  }
})().catch(e=>{
  $('#recipe').innerHTML=`<div class="empty"><h2>Błąd</h2><p>${esc(e.message)}</p></div>`;
});
</script>
</body>
</html>
