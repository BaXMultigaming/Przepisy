name: Recipes - setup and sync

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  build-recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Create repository files
        shell: bash
        run: |
          mkdir -p scripts data/recipes assets/images

          cat > scripts/sync_recipes.py <<'PYTHON_SCRIPT'
          #!/usr/bin/env python3
          from __future__ import annotations
          
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          ROOT = Path(__file__).resolve().parents[1]
          RECIPES_DIR = ROOT / "data" / "recipes"
          IMAGES_DIR = ROOT / "assets" / "images"
          MANIFEST_PATH = ROOT / "data" / "recipes_manifest.json"
          
          API_KEY = os.getenv("THEMEALDB_API_KEY", "").strip() or "1"
          API_BASE = f"https://www.themealdb.com/api/json/v1/{API_KEY}"
          USER_AGENT = "RecipeRepoSync/2.0 (GitHub Actions; TheMealDB API)"
          
          RECIPES_DIR.mkdir(parents=True, exist_ok=True)
          IMAGES_DIR.mkdir(parents=True, exist_ok=True)
          
          
          def http_get(url: str, *, binary: bool = False, retries: int = 5):
              last_exc = None
              for attempt in range(retries):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": USER_AGENT,
                          "Accept": "*/*" if binary else "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          payload = resp.read()
                          if binary:
                              return payload, resp.headers.get_content_type()
                          return json.loads(payload.decode("utf-8"))
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError) as exc:
                      last_exc = exc
                      if attempt + 1 < retries:
                          time.sleep(min(2 ** attempt, 16))
              raise RuntimeError(f"Request failed: {url}: {last_exc}")
          
          
          def clean(value):
              if value is None:
                  return None
              value = str(value).strip()
              return value or None
          
          
          def extract_ingredients(meal: dict) -> list[dict]:
              result = []
              for i in range(1, 21):
                  ingredient = clean(meal.get(f"strIngredient{i}"))
                  measure = clean(meal.get(f"strMeasure{i}"))
                  if ingredient:
                      result.append({
                          "ingredient": ingredient,
                          "measure": measure or ""
                      })
              return result
          
          
          def split_steps(raw: str | None) -> list[str]:
              if not raw:
                  return []
          
              raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip()
          
              # Prefer source line breaks.
              chunks = [
                  re.sub(r"\s+", " ", x).strip(" -•\t")
                  for x in raw.split("\n")
              ]
              chunks = [x for x in chunks if x]
          
              # Some recipes are returned as one large paragraph.
              if len(chunks) <= 1:
                  chunks = [
                      x.strip()
                      for x in re.split(r"(?<=[.!?])\s+(?=[A-Z0-9])", raw)
                      if x.strip()
                  ]
          
              return chunks
          
          
          def choose_image_extension(content_type: str, url: str) -> str:
              mapping = {
                  "image/jpeg": ".jpg",
                  "image/png": ".png",
                  "image/webp": ".webp",
                  "image/gif": ".gif",
              }
              if content_type in mapping:
                  return mapping[content_type]
          
              suffix = Path(urllib.parse.urlparse(url).path).suffix.lower()
              if suffix in {".jpg", ".jpeg", ".png", ".webp", ".gif"}:
                  return ".jpg" if suffix == ".jpeg" else suffix
              return ".jpg"
          
          
          def download_image(meal_id: str, image_url: str | None) -> str | None:
              if not image_url:
                  return None
          
              # Medium image keeps the repository much smaller while remaining
              # perfectly suitable for the recipe page.
              download_url = image_url.rstrip("/") + "/medium"
          
              try:
                  data, content_type = http_get(download_url, binary=True)
              except Exception:
                  # Fallback to original artwork.
                  try:
                      data, content_type = http_get(image_url, binary=True)
                  except Exception as exc:
                      print(f"WARN image {meal_id}: {exc}")
                      return None
          
              ext = choose_image_extension(content_type, image_url)
              rel = Path("assets") / "images" / f"{meal_id}{ext}"
              target = ROOT / rel
          
              if not target.exists() or target.read_bytes() != data:
                  target.write_bytes(data)
          
              return rel.as_posix()
          
          
          def normalize_recipe(meal: dict) -> dict:
              meal_id = str(meal.get("idMeal") or "").strip()
              if not meal_id:
                  raise ValueError("Recipe without idMeal")
          
              title = clean(meal.get("strMeal")) or f"Recipe {meal_id}"
              instructions = clean(meal.get("strInstructions")) or ""
              image_source = clean(meal.get("strMealThumb"))
              local_image = download_image(meal_id, image_source)
          
              tags = []
              raw_tags = clean(meal.get("strTags"))
              if raw_tags:
                  tags = [x.strip() for x in raw_tags.split(",") if x.strip()]
          
              return {
                  "id": meal_id,
                  "title": title,
                  "category": clean(meal.get("strCategory")),
                  "area": clean(meal.get("strArea")),
                  "tags": tags,
                  "ingredients": extract_ingredients(meal),
                  "instructions_raw": instructions,
                  "steps": split_steps(instructions),
                  "image": local_image,
                  "image_source": image_source,
                  "source_url": clean(meal.get("strSource"))
                      or f"https://www.themealdb.com/meal/{meal_id}",
                  "youtube": clean(meal.get("strYoutube")),
                  "attribution": "Recipe data and artwork via TheMealDB API"
              }
          
          
          def fetch_all_meals() -> dict[str, dict]:
              meals_by_id: dict[str, dict] = {}
          
              for letter in "abcdefghijklmnopqrstuvwxyz":
                  print(f"Fetching recipes beginning with {letter.upper()}...", flush=True)
                  payload = http_get(f"{API_BASE}/search.php?f={letter}")
          
                  for meal in (payload or {}).get("meals") or []:
                      meal_id = str(meal.get("idMeal") or "").strip()
                      if meal_id:
                          meals_by_id[meal_id] = meal
          
                  time.sleep(0.12)
          
              return meals_by_id
          
          
          def write_json_if_changed(path: Path, obj) -> None:
              text = json.dumps(obj, ensure_ascii=False, indent=2) + "\n"
              if not path.exists() or path.read_text(encoding="utf-8") != text:
                  path.write_text(text, encoding="utf-8")
          
          
          def remove_stale_files(valid_ids: set[str]) -> None:
              for path in RECIPES_DIR.glob("*.json"):
                  if path.stem not in valid_ids:
                      path.unlink()
          
              for path in IMAGES_DIR.iterdir():
                  if path.is_file() and path.stem not in valid_ids:
                      path.unlink()
          
          
          def main():
              meals = fetch_all_meals()
              print(f"Found {len(meals)} unique recipes.")
          
              if not meals:
                  raise RuntimeError("API returned no recipes; refusing to erase existing database.")
          
              manifest = []
              valid_ids = set(meals.keys())
          
              def sort_id(x):
                  return (0, int(x)) if x.isdigit() else (1, x)
          
              for index, meal_id in enumerate(sorted(meals, key=sort_id), 1):
                  recipe = normalize_recipe(meals[meal_id])
          
                  write_json_if_changed(
                      RECIPES_DIR / f"{meal_id}.json",
                      recipe
                  )
          
                  manifest.append({
                      "id": recipe["id"],
                      "title": recipe["title"],
                      "category": recipe["category"],
                      "area": recipe["area"],
                      "tags": recipe["tags"],
                      "ingredients_search": [
                          x["ingredient"] for x in recipe["ingredients"]
                      ],
                      "image": recipe["image"],
                      "file": f"data/recipes/{meal_id}.json",
                  })
          
                  print(f"[{index}/{len(meals)}] {recipe['title']}", flush=True)
          
              remove_stale_files(valid_ids)
          
              manifest.sort(key=lambda x: x["title"].casefold())
          
              write_json_if_changed(
                  MANIFEST_PATH,
                  {
                      "source": "TheMealDB official API",
                                "count": len(manifest),
                      "recipes": manifest,
                  }
              )
          
              print(f"Done. Database contains {len(manifest)} recipes.")
          
          
          if __name__ == "__main__":
              main()
          PYTHON_SCRIPT

          cat > index.html <<'INDEX_HTML'
          <!doctype html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#ffffff">
            <title>Moje przepisy</title>
            <style>
              *{box-sizing:border-box}
              body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#202124}
              header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:13px 16px}
              .head{max-width:1400px;margin:auto}
              h1{font-size:23px;margin:0 0 10px}
              #q{width:100%;font:inherit;padding:13px 14px;border:1px solid #bbb;border-radius:12px;outline:none}
              #q:focus{border-color:#555}
              #count{font-size:13px;color:#666;margin-top:7px}
              main{max-width:1400px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(270px,380px) minmax(0,1fr);gap:18px}
              #list{background:#fff;border-radius:15px;overflow:auto;max-height:calc(100vh - 130px);align-self:start;border:1px solid #e5e5e5}
              .item{display:flex;gap:11px;padding:10px;border-bottom:1px solid #eee;cursor:pointer}
              .item:hover,.item.active{background:#f4f4f4}
              .item img{width:78px;height:78px;object-fit:cover;border-radius:10px;background:#eee;flex:0 0 78px}
              .item strong{display:block;line-height:1.25}
              .meta{font-size:13px;color:#6b6b6b;margin-top:5px}
              article{background:#fff;border:1px solid #e5e5e5;border-radius:15px;padding:24px;min-height:420px;overflow:hidden}
              .hero{width:100%;max-height:560px;object-fit:cover;border-radius:14px;background:#eee}
              h2{font-size:clamp(27px,4vw,40px);line-height:1.12;margin:19px 0 8px}
              h3{font-size:21px;margin:29px 0 10px}
              li{margin:8px 0}
              .ingredients{columns:2;column-gap:35px}
              .ingredients li{break-inside:avoid}
              .step{margin:0 0 14px;padding:13px 14px;background:#f7f7f8;border-radius:11px}
              .step b{display:block;margin-bottom:4px}
              .source{margin-top:30px;padding-top:16px;border-top:1px solid #eee;color:#666;font-size:13px}
              .source a{color:inherit}
              .empty{padding:18px;color:#666}
              @media(max-width:800px){
                main{grid-template-columns:1fr;padding:10px}
                #list{max-height:42vh}
                article{padding:15px}
                .ingredients{columns:1}
                .item img{width:67px;height:67px;flex-basis:67px}
              }
            </style>
          </head>
          <body>
          <header>
            <div class="head">
              <h1>🍳 Moje przepisy</h1>
              <input id="q" type="search" placeholder="Szukaj nazwy, składnika, kategorii lub kraju…">
              <div id="count"></div>
            </div>
          </header>
          
          <main>
            <section id="list"><div class="empty">Ładowanie przepisów…</div></section>
            <article id="recipe"><p>Wybierz przepis z listy.</p></article>
          </main>
          
          <script>
          let recipes=[];
          let currentId=null;
          
          const list=document.querySelector('#list');
          const article=document.querySelector('#recipe');
          const input=document.querySelector('#q');
          const count=document.querySelector('#count');
          
          const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
          }[c]));
          
          async function init(){
            const response=await fetch('data/recipes_manifest.json',{cache:'no-store'});
            if(!response.ok) throw new Error(`HTTP ${response.status}`);
            const manifest=await response.json();
            recipes=manifest.recipes||[];
            renderList(recipes);
          
            const id=new URLSearchParams(location.search).get('id');
            if(id){
              const hit=recipes.find(x=>x.id===id);
              if(hit) await openRecipe(hit);
            }
          }
          
          function searchable(r){
            return [
              r.title,
              r.category,
              r.area,
              ...(r.tags||[]),
              ...(r.ingredients_search||[])
            ].filter(Boolean).join(' ').toLocaleLowerCase('pl');
          }
          
          function renderList(items){
            count.textContent=`${items.length} z ${recipes.length} przepisów`;
          
            if(!items.length){
              list.innerHTML='<div class="empty">Brak pasujących przepisów.</div>';
              return;
            }
          
            list.innerHTML=items.map(r=>`
              <div class="item ${r.id===currentId?'active':''}" data-id="${esc(r.id)}">
                ${r.image?`<img loading="lazy" src="${esc(r.image)}" alt="">`:''}
                <div>
                  <strong>${esc(r.title)}</strong>
                  <div class="meta">${esc([r.category,r.area].filter(Boolean).join(' • '))}</div>
                </div>
              </div>
            `).join('');
          
            list.querySelectorAll('.item').forEach(el=>{
              el.addEventListener('click',()=>{
                const hit=recipes.find(r=>r.id===el.dataset.id);
                if(hit) openRecipe(hit);
              });
            });
          }
          
          async function openRecipe(row){
            const response=await fetch(row.file,{cache:'no-store'});
            if(!response.ok) throw new Error(`HTTP ${response.status}`);
            const r=await response.json();
          
            currentId=r.id;
            history.replaceState(null,'',`?id=${encodeURIComponent(r.id)}`);
          
            article.innerHTML=`
              ${r.image?`<img class="hero" src="${esc(r.image)}" alt="${esc(r.title)}">`:''}
              <h2>${esc(r.title)}</h2>
              <div class="meta">${esc([
                r.category,
                r.area,
                (r.tags||[]).join(', ')
              ].filter(Boolean).join(' • '))}</div>
          
              <h3>Składniki</h3>
              <ul class="ingredients">
                ${(r.ingredients||[]).map(x=>
                  `<li><strong>${esc(x.measure)}</strong> ${esc(x.ingredient)}</li>`
                ).join('')}
              </ul>
          
              <h3>Przygotowanie krok po kroku</h3>
              <div>
                ${(r.steps||[]).map((x,i)=>
                  `<div class="step"><b>Krok ${i+1}</b>${esc(x)}</div>`
                ).join('')}
              </div>
          
              <div class="source">
                Dane przepisu: TheMealDB API.
                ${r.source_url?` <a href="${esc(r.source_url)}" target="_blank" rel="noopener">Otwórz źródło</a>`:''}
                ${r.youtube?` • <a href="${esc(r.youtube)}" target="_blank" rel="noopener">Film</a>`:''}
              </div>
            `;
          
            renderList(filterRecipes());
            window.scrollTo({top:0,behavior:'smooth'});
          }
          
          function filterRecipes(){
            const s=input.value.trim().toLocaleLowerCase('pl');
            if(!s) return recipes;
            return recipes.filter(r=>searchable(r).includes(s));
          }
          
          input.addEventListener('input',()=>renderList(filterRecipes()));
          
          init().catch(err=>{
            article.innerHTML=`
              <h2>Nie udało się wczytać bazy</h2>
              <p>${esc(err.message)}</p>
              <p>Uruchom workflow „Recipes - setup and sync”, aby utworzyć dane.</p>
            `;
          });
          </script>
          </body>
          </html>
          INDEX_HTML

          cat > README.md <<'README_FILE'
          # Recipe repository
          
          Repozytorium jest automatycznie zasilane danymi z oficjalnego API TheMealDB.
          
          - `index.html` – przeglądarka przepisów
          - `data/recipes/*.json` – każdy przepis w osobnym pliku
          - `data/recipes_manifest.json` – indeks wszystkich przepisów
          - `assets/images/` – lokalne zdjęcia
          - `scripts/sync_recipes.py` – synchronizacja danych
          
          Workflow można uruchomić ręcznie z zakładki **Actions** i uruchamia się również automatycznie raz dziennie.
          
          Jeżeli używasz repo jako publicznej aplikacji/serwisu, sprawdź aktualne warunki TheMealDB i w razie potrzeby dodaj sekret repozytorium `THEMEALDB_API_KEY`.
          README_FILE

          chmod +x scripts/sync_recipes.py

      - name: Download all recipes
        env:
          THEMEALDB_API_KEY: ${{ secrets.THEMEALDB_API_KEY }}
        run: python scripts/sync_recipes.py

      - name: Commit everything to repository
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html README.md scripts data assets
          git commit -m "chore: setup/update recipe database"
          git push
