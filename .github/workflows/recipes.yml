              <div class="empty">
                <h2>Wybierz przepis</h2>
                <p>Na telefonie możesz włączyć tryb gotowania i zablokować automatyczne wygaszanie ekranu.</p>
              </div>
            </article>
          </main>
          
          <div id="cookbar" class="cookbar" aria-label="Sterowanie gotowaniem">
            <button id="prevStep" type="button" aria-label="Poprzedni krok">←</button>
            <div class="step-status"><b id="stepLabel">Krok 1</b><small id="stepSub">z 1</small></div>
            <button id="nextStep" type="button" aria-label="Następny krok">→</button>
            <button id="cookWake" type="button">☀️ Ekran</button>
          </div>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
          
          <script>
          const $=s=>document.querySelector(s);
          
          const entityDecoder=document.createElement('textarea');
          function decodeText(value){
            let s=String(value??'');
            if(!s.includes('&'))return s;
          
            for(let i=0;i<3;i++){
              entityDecoder.innerHTML=s;
              const decoded=entityDecoder.value;
              if(decoded===s)break;
              s=decoded;
            }
            return s;
          }
          
          const esc=s=>decodeText(s).replace(/[&<>"']/g,c=>({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
          }[c]));
          let all=[],shown=120,current=null,currentKey=null,manifest=null,unit=localStorage.getItem('unit')||'US';
          let currentStep=0,wakeLock=null,wakeWanted=localStorage.getItem('keep-screen-awake')==='1',toastTimer=null;
          
          const frac={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
          
          function showToast(message){
            const t=$('#toast');
            t.textContent=message;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
          }
          
          function asArray(value){
            if(value==null)return[];
            if(Array.isArray(value))return value.flatMap(asArray).filter(Boolean);
            if(typeof value==='string'){
              const s=decodeText(value).trim();if(!s)return[];
              return s.includes(',')?s.split(',').map(x=>x.trim()).filter(Boolean):[s]
            }
            return[String(value)]
          }
          function unique(values){
            const out=[],seen=new Set();
            for(const value of values){
              const s=decodeText(value).trim();if(!s)continue;
              const key=s.toLocaleLowerCase('en-US');if(seen.has(key))continue;
              seen.add(key);out.push(s)
            }
            return out
          }
          function getCategories(r){return unique([...asArray(r.categories),...asArray(r.category)])}
          function getRegions(r){return unique([...asArray(r.regions),...asArray(r.cuisines),...asArray(r.cuisine),...asArray(r.area)])}
          function eqCI(a,b){return String(a||'').trim().toLocaleLowerCase('en-US')===String(b||'').trim().toLocaleLowerCase('en-US')}
          
          function num(s){
            s=String(s).trim();if(frac[s]!=null)return frac[s];
            let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];
            m=s.match(/^(\d+)\/(\d+)$/);if(m)return m[1]/m[2];
            let n=+s.replace(',','.');return Number.isFinite(n)?n:null
          }
          function fmt(n,d=1){return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:d}).format(n)}
          function euMeasure(s){
            s=normalizeIngredient(s);
            if(!s)return '';
            const q='(\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])';
            const rules=[
              [new RegExp('^'+q+'\\s*(cups?)\\b','i'),236.588,'ml'],
              [new RegExp('^'+q+'\\s*(tbsp|tablespoons?)\\b','i'),14.7868,'ml'],
              [new RegExp('^'+q+'\\s*(tsp|teaspoons?)\\b','i'),4.92892,'ml'],
              [new RegExp('^'+q+'\\s*(fl\\.?\\s*oz\\.?|fluid ounces?)\\b','i'),29.5735,'ml'],
              [new RegExp('^'+q+'\\s*(quarts?|qt)\\b','i'),946.353,'ml'],
              [new RegExp('^'+q+'\\s*(pints?|pt)\\b','i'),473.176,'ml'],
              [new RegExp('^'+q+'\\s*(lbs?|pounds?)\\b','i'),453.592,'g'],
              [new RegExp('^'+q+'\\s*(oz|ounces?)\\b','i'),28.3495,'g']
            ];
            for(const [re,f,u] of rules){
              let m=s.match(re);if(!m)continue;
              let n=num(m[1]);if(n==null)continue;
              let v=n*f,outUnit=u;
              if(u==='ml'&&v>=1000){v/=1000;outUnit='l'}
              if(u==='g'&&v>=1000){v/=1000;outUnit='kg'}
              return `${fmt(v,v<10?2:v<100?1:0)} ${outUnit}${s.slice(m[0].length)}`
            }
            return s
          }
          function euText(s){
            return String(s||'')
              .replace(/(\d{2,3})\s*(?:°\s*)?(?:degrees?\s*)?(?:F|Fahrenheit)\b/gi,(_,v)=>`${Math.round((((+v)-32)*5/9)/5)*5}°C`)
              .replace(/\b(\d+(?:[.,]\d+)?)\s*(?:inch|inches|in\.)\b/gi,(_,v)=>`${fmt(+v.replace(',','.')*2.54,1)} cm`)
          }
          function updateBtns(){
            document.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('on',b.dataset.u===unit))
          }
          
          
          function getHeroImage(r){
            return r?.images?.hero || r?.image || r?.image_source || r?.strMealThumb || null;
          }
          
          function getImageFallback(r){
            const primary=getHeroImage(r);
            const candidates=[
              r?.image_fallback,
              r?.image_source,
              r?.strMealThumb,
              r?.thumbnail
            ].filter(Boolean);
            return candidates.find(x=>x!==primary) || null;
          }
          
          function imageAttrs(primary,fallback){
            if(!primary)return '';
            return `src="${esc(primary)}"${fallback?` data-fallback="${esc(fallback)}"`:''}`;
          }
          
          function wireImageFallbacks(root=document){
            root.querySelectorAll('img[data-fallback]').forEach(img=>{
              if(img.dataset.fallbackBound==='1')return;
              img.dataset.fallbackBound='1';
              img.addEventListener('error',()=>{
                const fallback=img.dataset.fallback;
                if(fallback && img.src!==fallback){
                  img.removeAttribute('data-fallback');
                  img.src=fallback;
                }
              });
            });
          }
          
          function normalizeIngredient(x){
            if(typeof x === 'string')return decodeText(x).trim();
          
            if(x && typeof x === 'object'){
              const measure=decodeText(x.measure || '').trim();
              const ingredient=decodeText(x.ingredient || x.name || '').trim();
              return [measure,ingredient].filter(Boolean).join(' ').trim();
            }
          
            return decodeText(x ?? '').trim();
          }
          
          function normalizeStep(x){
            if(typeof x === 'string'){
              return {text:decodeText(x).trim(),image:null};
            }
          
            if(x && typeof x === 'object'){
              return {
                text:decodeText(x.text || x.description || x.name || '').trim(),
                image:x.image || null
              };
            }
          
            return {text:decodeText(x ?? '').trim(),image:null};
          }
          
          function buildFilterOptions(){
            const categoryCounts=new Map(),regionCounts=new Map();
            for(const r of all){
              for(const c of getCategories(r))categoryCounts.set(c,(categoryCounts.get(c)||0)+1);
              for(const g of getRegions(r))regionCounts.set(g,(regionCounts.get(g)||0)+1)
            }
            const sorted=map=>[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'pl',{sensitivity:'base'}));
            $('#categoryFilter').innerHTML='<option value="">Wszystkie kategorie</option>'+sorted(categoryCounts).map(([n,c])=>`<option value="${esc(n)}">${esc(n)} (${c})</option>`).join('');
            $('#regionFilter').innerHTML='<option value="">Wszystkie regiony</option>'+sorted(regionCounts).map(([n,c])=>`<option value="${esc(n)}">${esc(n)} (${c})</option>`).join('')
          }
          
          function filteredRecipes(){
            const q=$('#q').value.trim().toLocaleLowerCase('pl');
            const category=$('#categoryFilter').value,region=$('#regionFilter').value;
            return all.filter(r=>{
              const cats=getCategories(r),regs=getRegions(r);
              if(category&&!cats.some(x=>eqCI(x,category)))return false;
              if(region&&!regs.some(x=>eqCI(x,region)))return false;
              if(q){
                const hay=[r.title,...cats,...regs,...asArray(r.ingredients_search).map(normalizeIngredient)].filter(Boolean).join(' ').toLocaleLowerCase('pl');
                if(!hay.includes(q))return false
              }
              return true
            })
          }
          
          function renderList(){
            const filtered=filteredRecipes(),category=$('#categoryFilter').value,region=$('#regionFilter').value,q=$('#q').value.trim();
            const active=[];if(category)active.push(`kategoria: ${category}`);if(region)active.push(`region: ${region}`);if(q)active.push(`„${q}”`);
            $('#count').textContent=`${filtered.length.toLocaleString('pl-PL')} z ${all.length.toLocaleString('pl-PL')} przepisów${active.length?' • '+active.join(' • '):''}`;
            const part=filtered.slice(0,shown);
            $('#list').innerHTML=part.length?part.map(r=>{
              const meta=[...getCategories(r).slice(0,1),...getRegions(r).slice(0,1)];
              return `<div class="item ${currentKey===(r.key||String(r.id))?'active':''}" data-key="${esc(r.key||String(r.id))}">
                ${getHeroImage(r)?`<img loading="lazy" ${imageAttrs(getHeroImage(r),getImageFallback(r))} alt="">`:''}
                <div><b>${esc(r.title)}</b><div class="meta">${esc(meta.join(' • '))}</div></div>
              </div>`
            }).join(''):'<div class="empty">Brak przepisów dla wybranych filtrów.</div>';
            $('#more').hidden=part.length>=filtered.length;
            document.querySelectorAll('.item').forEach(x=>x.addEventListener('click',()=>{
              const row=all.find(r=>String(r.key||r.id)===String(x.dataset.key));if(row)openRecipe(row)
            }));
            $('#clearFilters').disabled=!category&&!region&&!q;
            wireImageFallbacks($('#list'))
          }
          
          function ingredientKey(){return current?`recipe-${currentKey||current.id}-ingredients`:''}
          function stepKey(){return current?`recipe-${currentKey||current.id}-step`:''}
          function savedIngredients(){
            try{return new Set(JSON.parse(localStorage.getItem(ingredientKey())||'[]'))}catch{return new Set()}
          }
          function saveIngredients(){
            if(!current)return;
            const checked=[...document.querySelectorAll('.ingredient-check:checked')].map(x=>+x.dataset.i);
            localStorage.setItem(ingredientKey(),JSON.stringify(checked))
          }
          
          async function openRecipe(row){
            const response=await fetch(row.file,{cache:'no-store'});
            if(!response.ok)throw new Error(`HTTP ${response.status}`);
            current=await response.json();
            current.title=decodeText(current.title);
            currentKey=row.key||String(row.id);
            currentStep=Math.max(0,Math.min((current.steps||[]).length-1,+localStorage.getItem(`recipe-${currentKey}-step`)||0));
            history.replaceState(null,'',`?id=${encodeURIComponent(currentKey||current.id)}`);
            renderRecipe();renderList();
            $('#recipe').scrollIntoView({behavior:'smooth',block:'start'});
            if(wakeWanted)requestWakeLock(false)
          }
          
          function renderRecipe(){
            if(!current)return;
            const r=current,cats=getCategories(r),regs=getRegions(r),labels=[...cats,...regs],checked=savedIngredients();
            $('#recipe').innerHTML=`
              <div class="recipe-tools">
                <button class="tool" id="backToList" type="button">← Lista</button>
                <button class="tool primary" id="cookingMode" type="button">${document.body.classList.contains('cooking-mode')?'Zakończ gotowanie':'🍳 Tryb gotowania'}</button>
                <div class="tool-spacer"></div>
                <button class="tool wake-action ${wakeLock&&!wakeLock.released?'awake-on':''}" type="button"><span class="wake-dot"></span>${wakeLock&&!wakeLock.released?'Ekran aktywny':'Nie wygaszaj'}</button>
              </div>
              <div class="hero">
                ${getHeroImage(r)?`<img ${imageAttrs(getHeroImage(r),getImageFallback(r))} alt="${esc(r.title)}">`:''}
                <div class="title"><div>${esc(labels.join(' • '))}</div><h1>${esc(r.title)}</h1></div>
              </div>
              <div class="body">
                <div class="note">${unit==='US'?'🇺🇸 Oryginalne miary USA.':'🇪🇺 Automatyczne przeliczenie na miary europejskie.'}</div>
                <div class="quick-jumps">
                  <button type="button" data-jump="ingredientsTitle">🧺 Składniki</button>
                  <button type="button" data-jump="stepsTitle">👩‍🍳 Kroki</button>
                  ${r.yield?.length?`<button type="button" disabled>🍽️ ${esc(r.yield.join(', '))}</button>`:''}
                </div>
          
                <h2 id="ingredientsTitle">🧺 Składniki</h2>
                <div class="ingredients">
                  ${(r.ingredients||[]).map((x,i)=>{const value=normalizeIngredient(x);return `<label class="ing ${checked.has(i)?'checked':''}">
                    <input class="ingredient-check" data-i="${i}" type="checkbox" ${checked.has(i)?'checked':''}>
                    <span>${esc(unit==='EU'?euMeasure(value):value)}</span>
                  </label>`}).join('')}
                </div>
          
                <h2 id="stepsTitle">👩‍🍳 Przygotowanie</h2>
                <div class="steps">
                  ${(r.steps||[]).map((x,i)=>{const step=normalizeStep(x);return `<div class="step ${i===currentStep?'current':''}" data-step="${i}">
                    <div class="n">${i+1}</div>
                    <div>${esc(unit==='EU'?euText(step.text):step.text)}${step.image?`<img loading="lazy" src="${esc(step.image)}" alt="">`:''}</div>
                  </div>`}).join('')}
                </div>
                ${r.yield?.length?`<div class="source">Porcje: ${esc(r.yield.join(', '))}</div>`:''}
              </div>`;
          
            $('#backToList').addEventListener('click',()=>{
              if(document.body.classList.contains('cooking-mode'))toggleCookingMode(false);
              document.querySelector('aside').scrollIntoView({behavior:'smooth',block:'start'})
            });
            $('#cookingMode').addEventListener('click',()=>toggleCookingMode());
            document.querySelectorAll('.wake-action').forEach(b=>b.addEventListener('click',toggleWakeLock));
            document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})));
            document.querySelectorAll('.ingredient-check').forEach(box=>box.addEventListener('change',()=>{
              box.closest('.ing')?.classList.toggle('checked',box.checked);saveIngredients()
            }));
            document.querySelectorAll('.step').forEach(step=>step.addEventListener('click',()=>setCurrentStep(+step.dataset.step,false)));
            updateCookingBar();
            wireImageFallbacks($('#recipe'))
          }
          
          function toggleCookingMode(force){
            const on=typeof force==='boolean'?force:!document.body.classList.contains('cooking-mode');
            document.body.classList.toggle('cooking-mode',on);
            localStorage.setItem('cooking-mode',on?'1':'0');
            if(current)renderRecipe();
            if(on&&current)setTimeout(()=>scrollToStep(currentStep,false),80)
          }
          
          function setCurrentStep(index,scroll=true){
            if(!current)return;
            const total=(current.steps||[]).length;
            if(!total)return;
            currentStep=Math.max(0,Math.min(total-1,index));
            localStorage.setItem(stepKey(),String(currentStep));
            document.querySelectorAll('.step').forEach(x=>x.classList.toggle('current',+x.dataset.step===currentStep));
            updateCookingBar();
            if(scroll)scrollToStep(currentStep,true)
          }
          function scrollToStep(index,smooth=true){
            document.querySelector(`.step[data-step="${index}"]`)?.scrollIntoView({behavior:smooth?'smooth':'auto',block:'center'})
          }
          function updateCookingBar(){
            const total=current?.steps?.length||0;
            $('#cookbar').classList.toggle('visible',!!current&&total>0);
            $('#prevStep').disabled=!total||currentStep<=0;
            $('#nextStep').disabled=!total||currentStep>=total-1;
            $('#stepLabel').textContent=total?`Krok ${currentStep+1}`:'Krok';
            $('#stepSub').textContent=total?`z ${total}`:'';
            updateWakeUI()
          }
          
          function wakeSupported(){return 'wakeLock' in navigator&&window.isSecureContext}
          async function requestWakeLock(showErrors=true){
            if(!wakeSupported()){
              wakeWanted=false;localStorage.setItem('keep-screen-awake','0');updateWakeUI();
              if(showErrors)showToast('Ta przeglądarka nie obsługuje blokady wygaszania ekranu albo strona nie działa przez HTTPS.');
              return false
            }
            if(document.visibilityState!=='visible')return false;
            if(wakeLock&&!wakeLock.released){updateWakeUI();return true}
            try{
              wakeLock=await navigator.wakeLock.request('screen');
              wakeLock.addEventListener('release',()=>updateWakeUI(),{once:true});
              updateWakeUI();
              if(showErrors)showToast('Ekran nie będzie się automatycznie wygaszał podczas gotowania.');
              return true
            }catch(err){
              updateWakeUI();
              if(showErrors)showToast('Telefon nie pozwolił utrzymać ekranu aktywnego. Sprawdź tryb oszczędzania baterii.');
              return false
            }
          }
          async function toggleWakeLock(){
            if(wakeWanted){
              wakeWanted=false;localStorage.setItem('keep-screen-awake','0');
              if(wakeLock&&!wakeLock.released)await wakeLock.release();
              wakeLock=null;updateWakeUI();showToast('Automatyczne wygaszanie ekranu znów jest dozwolone.')
            }else{
              wakeWanted=true;localStorage.setItem('keep-screen-awake','1');
              const ok=await requestWakeLock(true);
              if(!ok&&!wakeSupported())wakeWanted=false
            }
          }
          function updateWakeUI(){
            const active=!!wakeLock&&!wakeLock.released;
            document.querySelectorAll('.wake-action').forEach(b=>{
              b.classList.toggle('awake-on',active);
              b.innerHTML=`<span class="wake-dot"></span>${active?'Ekran aktywny':'Nie wygaszaj'}`
            });
            const b=$('#cookWake');
            b.classList.toggle('on',active);
            b.textContent=active?'☀️ Ekran: ON':'☀️ Nie wygaszaj'
          }
          
          function refreshFilters(){shown=120;renderList()}
          document.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>{
            unit=b.dataset.u;localStorage.setItem('unit',unit);updateBtns();if(current)renderRecipe()
          }));
          $('#q').addEventListener('input',refreshFilters);
          $('#categoryFilter').addEventListener('change',refreshFilters);
          $('#regionFilter').addEventListener('change',refreshFilters);
          $('#more').addEventListener('click',()=>{shown+=120;renderList()});
          $('#clearFilters').addEventListener('click',()=>{
            $('#q').value='';$('#categoryFilter').value='';$('#regionFilter').value='';shown=120;renderList()
          });
          $('#prevStep').addEventListener('click',()=>setCurrentStep(currentStep-1,true));
          $('#nextStep').addEventListener('click',()=>setCurrentStep(currentStep+1,true));
          $('#cookWake').addEventListener('click',toggleWakeLock);
          
          document.addEventListener('visibilitychange',async()=>{
            if(wakeWanted&&document.visibilityState==='visible')await requestWakeLock(false)
          });
          
          (async()=>{
            updateBtns();updateWakeUI();
            const response=await fetch('data/recipes_manifest.json',{cache:'no-store'});
            if(!response.ok)throw new Error(`Nie udało się pobrać manifestu: HTTP ${response.status}`);
            manifest=await response.json();
            all=(manifest.recipes||[]).map(r=>({...r,title:decodeText(r.title),categories:getCategories(r),regions:getRegions(r)}));
            buildFilterOptions();renderList();
            const id=new URLSearchParams(location.search).get('id');
            if(id){
              const hit=all.find(x=>String(x.key||x.id)===String(id)) || all.find(x=>String(x.id)===String(id));
              if(hit)await openRecipe(hit)
            }
          })().catch(e=>{
            $('#recipe').innerHTML=`<div class="empty"><h2>Błąd</h2><p>${esc(e.message)}</p></div>`
          });
          </script>
          </body>
          </html>
          HTML

          chmod +x scripts/allrecipes_sync.py

      - name: Discover recipe URLs and rebuild categories/regions
        env:
          WORKERS: ${{ inputs.workers || '12' }}
          IMAGE_MODE: ${{ inputs.image_mode || 'hero' }}
        run: |
          python scripts/allrecipes_sync.py --discover
          python scripts/allrecipes_sync.py --status

      - name: Commit discovery and filter metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/allrecipes_sync.py index.html data
          if ! git diff --cached --quiet; then
            git commit -m "fix: categories and regions filters"
            git push
          fi

      - name: Download every missing recipe in this workflow run
        shell: bash
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
          WORKERS: ${{ inputs.workers || '12' }}
          IMAGE_MODE: ${{ inputs.image_mode || 'hero' }}
          REQUEST_DELAY: '0.12'
          IMAGE_MAX_PX: '1280'
          IMAGE_QUALITY: '82'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while true; do
            PENDING=$(python - <<'PY2'
          import json
          from pathlib import Path
          p=Path("data/crawl_state.json")
          print(json.loads(p.read_text(encoding="utf-8")).get("pending",1) if p.exists() else 1)
          PY2
            )

            echo "Pending before checkpoint: $PENDING"

            if [ "$PENDING" = "0" ]; then
              break
            fi

            python scripts/allrecipes_sync.py --batch "$BATCH_SIZE"

            git add data assets/images
            if ! git diff --cached --quiet; then
              git commit -m "data: archive next recipe checkpoint"
              git push
            fi
          done

      - name: Rebuild manifest facets after download
        shell: bash
        run: |
          python scripts/allrecipes_sync.py --status
          python scripts/allrecipes_sync.py --verify || true

          git add data/recipes_manifest.json data/crawl_state.json data/verification_report.json data/failures.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh recipe manifest and facets"
            git push
          fi

      - name: Strict verification when archive is complete
        shell: bash
        run: |
          PENDING=$(python - <<'PY'
          import json
          with open("data/crawl_state.json", encoding="utf-8") as f:
              print(json.load(f).get("pending", 1))
          PY
          )

          if [ "$PENDING" = "0" ]; then
            python scripts/allrecipes_sync.py --verify --strict
          else
            echo "Archive is still being filled: $PENDING recipes pending."
          fi
